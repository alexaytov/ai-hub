


spring:
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: true
    hibernate:
      ddl-auto: update
  sql:
    init:
      mode: never
  mvc:
    hiddenmethod:
      filter:
        enabled: 'true'
  datasource:
    hikari:
      auto-commit: false
    driverClassName: org.postgresql.Driver
    password:
    username:
    url: jdbc:postgresql://localhost:5432/ai-hub
logging:
  level:
    org:
      hibernate:
        type:
          descriptor: TRACE
        SQL: DEBUG
      nodeValue: WARN
    blog: WARN
server:
  port: 1002
security.jwt.token.secret-key: my-secret-key
api-key.secret: ${API_KEY_SECRET:XiVTCEWnPSD3/7B2juL4xwecc7vwsVd6CqpHGNwKvZU=}
audit-log:
  service:
    url: ${AUDIT_LOG_SERVICE_URL:http://localhost:1001}

chromadb:
  host: http://localhost:8000